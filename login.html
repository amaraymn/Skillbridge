
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <section class="auth-section">
        <div class="container">
            <div class="row align-items-center justify-content-center">

                <!-- Left Content -->
                <div class="col-lg-6 auth-info">
                    <a href="index.html" class="auth-brand">
                        <i class="fa-solid fa-bridge"></i>
                        SkillBridge
                    </a>

                    <h1>Welcome <span>Back!</span></h1>

                    <p>
                        Continue your journey, improve your skills,
                        and get closer to your dream career.
                    </p>

                    <div class="auth-visual">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <h3>Your Future Starts Here</h3>
                        <p>Learn. Improve. Grow.</p>
                    </div>
                </div>

                <!-- Login Form -->
                <div class="col-lg-5 offset-lg-1">
                    <div class="auth-card">

                        <h2>Login to Your Account</h2>
                        <p class="auth-subtitle">Enter your details to continue</p>

                        <form id="loginForm" action="dashboard.html">

                            <div class="mb-4">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control"
                                    placeholder="Enter your email" required>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter your password" required>
                            </div>

                            <div class="auth-options">
                                <label>
                                    <input type="checkbox">
                                    Remember me
                                </label>

                                <a href="#">Forgot Password?</a>
                            </div>

                            

                            <button type="submit" class="auth-submit">
                                Login
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>

                        </form>

                        <p class="auth-switch">
                            Don't have an account?
                            <a href="register.html">Create Account</a>
                        </p>

                        <a href="index.html" class="back-home">
                            <i class="fa-solid fa-arrow-left"></i>
                            Back to Home
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>

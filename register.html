
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge | Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="auth-section">
    <div class="container">
        <div class="row align-items-center justify-content-between">

            <!-- Left Side -->
            <div class="col-lg-5 auth-info">
                <a href="index.html" class="auth-brand">
                    <i class="fa-solid fa-graduation-cap"></i>
                    SkillBridge
                </a>

                <h1>Start Building Your <span>Future</span> Today.</h1>

                <p>
                    Create your account and take the first step
                    toward discovering your skills and building
                    your career path.
                </p>

                <div class="auth-visual">
                    <i class="fa-solid fa-rocket"></i>
                </div>
            </div>

            <!-- Right Side -->
            <div class="col-lg-5">
                <div class="auth-card">

                    <div class="text-center mb-4">
                        <h2>Create Account</h2>
                        <p>Join SkillBridge and start your journey</p>
                    </div>

                    <form id="registerForm" action="dashboard.html">

                        <div class="mb-3">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="name"
                                class="form-control"
                                placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email"
                                class="form-control"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="specialization">Your Specialization</label>
                            <select id="specialization" name="specialization"
                                class="form-select" required>
                                <option value="" selected disabled>
                                    Select your specialization
                                </option>
                                <option value="web-development">Web Development</option>
                                <option value="mobile-development">Mobile Development</option>
                                <option value="software-engineering">Software Engineering</option>
                                <option value="data-science">Data Science</option>
                                <option value="cyber-security">Cyber Security</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password"
                                class="form-control"
                                placeholder="Create a password" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword"
                                name="password_confirmation"
                                class="form-control"
                                placeholder="Confirm your password" required>
                        </div>

                        <button type="submit" class="btn auth-submit w-100">
                            Create Account
                            <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>

                    </form>

                    <div class="auth-switch text-center mt-4">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </div>

                    <div class="text-center mt-4">
                        <a href="index.html" class="back-home">
                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Back to Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>

</body>
</html>
